  "/flair-gg-vp-server/keyword-search":
    get:
      summary: GET /flair-gg-vp-server/keyword-search
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
        example: "  wheat  "
      responses:
        '200':
          description: strips the keyword and delegates to VP#keyword_search_shell
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                  required:
                  - title
              example:
              - title: Matching Resource
    post:
      summary: POST /flair-gg-vp-server/keyword-search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyword:
                  type: string
            example:
              keyword: seed
      responses:
        '200':
          description: treats a missing keyword as an empty string rather than raising
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                  required:
                  - title
              example: []
  "/flair-gg-vp-server/mcp":
    post:
      summary: POST /flair-gg-vp-server/mcp
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                id:
                  type: integer
                method:
                  type: string
                params:
                  type: object
                  properties:
                    name:
                      type: string
                    arguments:
                      type: object
                      properties:
                        keyword:
                          type: string
              required:
              - jsonrpc
              - id
              - method
              - params
            example:
              jsonrpc: '2.0'
              id: 1
              method: not/a/real/method
              params:
                name: not_a_real_tool
                arguments:
                  keyword: cancer
      responses:
        '200':
          description: returns a JSON-RPC error for an unknown method
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id:
                    type: integer
                  result:
                    type: object
                    properties:
                      protocolVersion:
                        type: string
                      capabilities:
                        type: object
                        properties:
                          tools:
                            type: object
                            properties: {}
                        required:
                        - tools
                      serverInfo:
                        type: object
                        properties:
                          name:
                            type: string
                          version:
                            type: string
                        required:
                        - name
                        - version
                      tools:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            inputSchema:
                              type: object
                              properties:
                                type:
                                  type: string
                                properties:
                                  type: object
                                  properties:
                                    keyword:
                                      type: object
                                      properties:
                                        type:
                                          type: string
                                        description:
                                          type: string
                                      required:
                                      - type
                                      - description
                                  required:
                                  - keyword
                                required:
                                  type: array
                                  items:
                                    type: string
                              required:
                              - type
                              - properties
                              - required
                          required:
                          - name
                          - description
                          - inputSchema
                      content:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            text:
                              type: string
                          required:
                          - type
                          - text
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
                    required:
                    - code
                    - message
                required:
                - jsonrpc
                - id
              example:
                jsonrpc: '2.0'
                id: 1
                result:
                  protocolVersion: '2025-06-18'
                  capabilities:
                    tools: {}
                  serverInfo:
                    name: flair-gg-vp-server
                    version: 1.0.0
                  tools:
                  - name: keyword_search
                    description: Searches the FLAIR-GG VP network for resources whose
                      metadata contains the given keyword. Case-insensitive.
                    inputSchema:
                      type: object
                      properties:
                        keyword:
                          type: string
                          description: The term to search for
                      required:
                      - keyword
                  content:
                  - type: text
                    text: '[{"title":"Match"}]'
                error:
                  code: -32601
                  message: 'Method not found: not/a/real/method'
