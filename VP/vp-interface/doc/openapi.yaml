                                                        description:
                                                          type: string
                                                      required:
                                                      - type
                                                      - description
                                                  required:
                                                  - keyword
                                                required:
                                                  type: array
                                                  items:
                                                    type: string
                                              required:
                                              - type
                                              - properties
                                              - required
                                          required:
                                          - name
                                          - description
                                          - inputSchema
                                      content:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            type:
                                              type: string
                                            text:
                                              type: string
                                          required:
                                          - type
                                          - text
