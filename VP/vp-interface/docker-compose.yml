version: "3.0"
services:

  flair-gg-vp-server:
    image: markw/flair-gg-vp-server:0.3.3
    restart: always
    container_name: "flair-gg-vp-server-bgv"
    hostname: "flairgg"
    ports:
      - "4567:4567"
    command: bundle exec ruby /server/vp-interface/run.rb
    volumes:
      - ./cache:/server/vp-interface/cache/
    environment:
      - RUBYOPT=-W0 -KU
      - FDPINDEX=https://index.bgv.cbgp.upm.es/
#      - RUBYOPT=-W0 -KU -E utf-8:utf-8
    depends_on:
      - swagger
      - swagger-converter

  swagger:
    image: swaggerapi/swagger-ui:latest
    restart: always
    container_name: "swagger"
    ports:
      - "4566:8080"
    environment:
      - SUPPORTED_SUBMIT_METHODS=${SUPPORTED_SUBMIT_METHODS}
      - URLS=${URLS}
      - BASE_URL='/swagger'   # for our reverse proxy

  swagger-converter:
    image: swaggerapi/swagger-converter:latest
    restart: always
    container_name: "swagger-converter"
    ports:
      - "8081:8080"

  ldp:
    image: markw/ldp_server:latest
    hostname: flair-ldp
    ports:
      - 1111:1111
      - 8890:8890
